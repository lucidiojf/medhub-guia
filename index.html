<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedHub - Guia Clínico & Fichas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col pb-16">

    <!-- Topo Fixo com Busca Inteligente -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 p-3 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between mb-2">
            <h1 class="text-sm font-black flex items-center gap-1.5"><span>📖</span> MedHub Guia Clínico</h1>
            <span class="text-[10px] bg-indigo-900 border border-indigo-700 px-2 py-0.5 rounded-full font-bold">TMA-2</span>
        </div>
        <div class="max-w-md mx-auto">
            <input type="text" id="globalSearch" onkeyup="filtrarConteudo()" placeholder="🔍 Pesquisar em todo o guia (ex: Atropina, IAM, Asma)..." class="w-full py-2 px-3 bg-slate-800 text-white placeholder-gray-400 text-xs rounded-xl border border-slate-700 focus:outline-none focus:bg-white focus:text-gray-900 transition-all font-medium">
        </div>
    </header>

    <!-- Submenu Horizontal de Categorias -->
    <nav class="bg-white border-b border-gray-200 sticky top-[85px] z-40 shadow-sm">
        <div class="max-w-md mx-auto overflow-x-auto no-scrollbar flex gap-1.5 p-2">
            <button onclick="mudarTabGuia('tab-fichas')" id="btn-fichas" class="btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 text-rose-700 border-2 border-rose-500/20">☣️ Fichas Tox (45)</button>
            <button onclick="mudarTabGuia('tab-antidotos')" id="btn-antidotos" class="btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold text-gray-500 border border-transparent">💉 Antídotos (15)</button>
            <button onclick="mudarTabGuia('tab-peconha')" id="btn-peconha" class="btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold text-gray-500 border border-transparent">🐍 Peçonhentos</button>
            <button onclick="mudarTabGuia('tab-dmhas')" id="btn-dmhas" class="btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold text-gray-500 border border-transparent">🫀 DM & HAS</button>
            <button onclick="mudarTabGuia('tab-presc')" id="btn-presc" class="btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold text-gray-500 border border-transparent">📋 Prescrições (25)</button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto w-full p-4 space-y-3 flex-grow">

        <!-- 1. FICHAS TOXICOLÓGICAS (CIATOX / IJF) -->
        <section id="tab-fichas" class="tab-guia-sec space-y-3">
            <div class="text-[11px] font-black uppercase text-rose-900 tracking-wider px-1">Fichas Toxicológicas Clássicas (CIATox / IJF)</div>
            <div id="lista-fichas" class="space-y-3"></div>
        </section>

        <!-- 2. ANTÍDOTOS (TODOS OS 15) -->
        <section id="tab-antidotos" class="tab-guia-sec hidden space-y-3">
            <div class="text-[11px] font-black uppercase text-emerald-900 tracking-wider px-1">Antídotos & Posologias de Emergência</div>
            <div id="lista-antidotos" class="space-y-3"></div>
        </section>

        <!-- 3. ANIMAIS PEÇONHENTOS & SERPENTES -->
        <section id="tab-peconha" class="tab-guia-sec hidden space-y-3">
            <div class="text-[11px] font-black uppercase text-amber-900 tracking-wider px-1">Serpentes e Animais Peçonhentos</div>
            <div id="lista-peconha" class="space-y-3"></div>
        </section>

        <!-- 4. DIRETRIZES DE HAS & DM -->
        <section id="tab-dmhas" class="tab-guia-sec hidden space-y-3">
            <div class="text-[11px] font-black uppercase text-purple-900 tracking-wider px-1">Diretrizes Ambulatoriais e Doses (DM & HAS)</div>
            <div id="lista-dmhas" class="space-y-3"></div>
        </section>

        <!-- 5. PRESCRIÇÕES HOSPITALARES & PEDIATRIA (25 PROTOCOLOS) -->
        <section id="tab-presc" class="tab-guia-sec hidden space-y-3">
            <div class="text-[11px] font-black uppercase text-blue-900 tracking-wider px-1">Manual de Prescrições e Protocolos Hospitalares</div>
            <div id="lista-presc" class="space-y-3"></div>
        </section>

    </main>

    <!-- MODAL DE LEITURA E ENCAMINHAMENTO -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center sm:items-center p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div class="p-3.5 border-b border-gray-100 flex items-center justify-between bg-slate-50">
                <span id="modalCategory" class="text-[10px] font-black uppercase text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full">--</span>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-700 text-lg font-bold p-1">✕</button>
            </div>
            <div class="p-4 overflow-y-auto space-y-3 text-xs leading-relaxed" id="modalBody"></div>
            <div class="p-3 border-t bg-gray-50 flex gap-2">
                <button id="btnEnviar" onclick="enviarCondutaChat()" class="flex-1 py-3 bg-indigo-700 hover:bg-indigo-800 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                    <span>📤</span> Enviar ao Telegram
                </button>
                <button onclick="copiarConduta()" class="px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-bold">
                    📋 Copiar
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE DADOS E NAVEGAÇÃO -->
    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        let textoModalAtivo = "";

        // Troca de Abas
        function mudarTabGuia(id) {
            document.querySelectorAll('.tab-guia-sec').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.btn-guia').forEach(btn => {
                btn.className = "btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold text-gray-500 border border-transparent";
            });
            document.getElementById(id).classList.remove('hidden');
            const target = document.getElementById(id.replace('tab-', 'btn-'));
            if (target) target.className = "btn-guia shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 text-rose-700 border-2 border-rose-500/20";
        }

        // Catálogo de Fichas Toxicológicas (IJF)
        const fichasTox = [
            { id: "FICHA - 001", nome: "Ácido Acetil Salicílico (Aspirina®)", sin: "Náuseas, hiperventilação, acidose metabólica, zumbidos, letargia, convulsões, coma.", ex: "Dosagem sérica de AAS (após 6h), gasometria, coagulograma, ureia, creatinina e ECG.", cond: "Lavagem gástrica, carvão ativado seriado; Bicarbonato de Sódio EV para alcalinização urinária; hemodiálise em casos graves." },
            { id: "FICHA - 002", nome: "Abelhas, Vespas e Marimbondos", sin: "Dor e edema local, anafilaxia, edema de glote e choque. Picadas maciças (>100): rabdomiólise e LRA.", ex: "Hemograma, INR, glicose, CK total, bilirrubinas, ureia e creatinina.", cond: "Compressas frias, raspagem dos ferrões com lâmina. Adrenalina 1:1000 SC/IM (0,2 a 0,5 ml), anti-histamínicos e hidratação vigorosa." },
            { id: "FICHA - 003", nome: "Ácido Clorídrico e Soda Cáustica (Corrosivos)", sin: "Dor orofaríngea intensa, sialorreia, estenose e perfuração esofágica/gástrica, choque.", ex: "RX tórax/abdômen, endoscopia digestiva alta precoce (12-24h) e avaliação cirúrgica.", cond: "NÃO induzir vômito nem lavagem gástrica. Carvão ativado contraindicado. Jejum, analgesia potente e hidratação venosa." },
            { id: "FICHA - 006", nome: "Solvente Orgânico / Acetona® (Propanona)", sin: "Irritação brônquica, ataxia, hipotensão, náuseas, gastrite hemorrágica e coma em doses maciças.", ex: "Glicemia, TGO, TGP, ureia, creatinina e gasometria.", cond: "Lavagem gástrica e carvão ativado se precoce (<30 min). Suporte respiratório e sintomáticos." },
            { id: "FICHA - 007", nome: "Broncodilatadores (Teofilina, Aminofilina)", sin: "Taquicardia, broncoespasmo, tremores, arritmias ventriculares, hipocalemia profunda e convulsões.", ex: "ECG contínuo, gasometria, eletrólitos (K, Ca, Mg) e teofilinemia.", cond: "Lavagem gástrica, carvão ativado seriado, Diazepam EV para convulsões, reposição de K e betabloqueador para arritmia." },
            { id: "FICHA - 008", nome: "Aranha Armadeira (Phoneutria nigriventer)", sin: "Dor lancinante imediata, sudorese local. Gravidade: vômitos, priapismo, edema agudo de pulmão e choque.", ex: "ECG contínuo, eletrólitos e gasometria.", cond: "Infiltração com Lidocaína 2% sem vasoconstritor no ponto da picada. Soro Antiaraquídico (SAA) EV (2 a 6 ampolas) nos casos moderados/graves." },
            { id: "FICHA - 009", nome: "Antidepressivos Tricíclicos (Amitriptilina, Nortriptilina)", sin: "Efeitos anticolinérgicos: boca seca, midríase, rubor, retenção urinária. Gravidade: QRS > 100ms, arritmias ventriculares, hipotensão refratária e coma.", ex: "ECG contínuo (monitorar QRS e QT), gasometria e eletrólitos.", cond: "Lavagem e carvão ativado seriado. Bicarbonato de Sódio 8,4% (1 a 2 mEq/kg EV em bolus) obrigatório se QRS > 100 ms. Diazepam para convulsões." },
            { id: "FICHA - 010", nome: "Neurolépticos (Haloperidol, Clorpromazina)", sin: "Crises oculógiras, trismo, torcicolo espasmódico, distonia aguda e rigidez (síndrome extrapiramidal).", ex: "Avaliação clínica e dosagem de CK total.", cond: "Lavagem e carvão. Antídoto: Biperideno (Akineton®) 3 a 5 mg EV/IM em adultos (0,06 a 0,1 mg/kg em crianças)." },
            { id: "FICHA - 011", nome: "Plantas com Toxoalbumina (Mamona, Pinhão Roxo)", sin: "Início retardado (horas/dias). Vômitos, cólicas intensas, diarreia sanguinolenta, desidratação grave e choque.", ex: "Hemograma, eletrólitos e função renal/hepática.", cond: "Hidratação venosa vigorosa, lavagem gástrica precoce e carvão ativado em doses seriadas." },
            { id: "FICHA - 012", nome: "Aranha Viúva Negra (Latrodectus / Janduim)", sin: "Dor intensa irradiada para abdômen (abdômen em tábua simulando abdômen agudo cirúrgico), tremores e sudorese profusa.", ex: "Eletrólitos, CK total, sumário de urina e ECG.", cond: "Opioides para dor, Diazepam EV para relaxamento muscular, Gluconato de Cálcio 10% EV e Soro Antilatrodectus (1-2 ampolas)." },
            { id: "FICHA - 013", nome: "Aranha Marrom (Loxosceles sp.)", sin: "Picada pouco dolorosa inicial. Após 12-24h: placa marmórea com necrose central. Forma cutâneo-visceral: hemólise intravascular maciça, icterícia e LRA.", ex: "Hemograma, sumário de urina, bilirrubinas, LDH e creatinina.", cond: "Prednisona 0,5 a 1 mg/kg/dia por 7-10 dias, Dapsona 100 mg/dia. Soro Antiloxoscélico / Antiaraquídico (5 a 10 ampolas)." },
            { id: "FICHA - 014", nome: "Peróxido de Hidrogênio (Água Oxigenada concentrada)", sin: "Irritação digestiva, distensão abdominal mecânica por liberação rápida de oxigênio gasoso, queimação e risco de embolia.", ex: "Endoscopia se concentração elevada (>10%).", cond: "Tratamento sintomático e hidratação. Lavar pele e mucosas com água abundante." },
            { id: "FICHA - 015", nome: "Descongestionantes / Nafazolina (Adnax®, Sorine®)", sin: "Sonolência, letargia profunda, bradicardia acentuada, hipotermia, sudorese e depressão respiratória grave (especialmente em bebês).", ex: "Glicemia, gasometria e monitorização ventilatória.", cond: "Lavagem gástrica até 1h e suporte respiratório. Naloxona EV (0,01 a 0,1 mg/kg) pode reverter a depressão central." },
            { id: "FICHA - 016", nome: "Anti-Histamínicos (Prometazina, Difenidramina)", sin: "Sedação ou excitação paradoxal, delírios, alucinações, boca seca, midríase, retenção urinária e hipertermia.", ex: "Eletrólitos, CK total e ECG.", cond: "Lavagem gástrica e carvão ativado. Diazepam EV para controle de agitação e convulsões. Resfriamento corporal." },
            { id: "FICHA - 017", nome: "Aminas Simpaticomiméticas (Adrenalina, Efedrina)", sin: "Tremores, midríase, hipertensão arterial severa, taquiarritmias ventriculares, dor torácica e risco de AVE/IAM.", ex: "ECG contínuo, glicemia e eletrólitos.", cond: "Diazepam EV para relaxamento e controle adrenérgico. Nitroprussiato de Sódio (Nipride) nas crises hipertensivas severas." },
            { id: "FICHA - 018", nome: "Paracetamol (Acetaminofeno)", sin: "Primeiras 24h assintomáticas. Após 48-72h: necrose hepática maciça, icterícia, encefalopatia, coagulopatia grave e óbito.", ex: "Nível sérico de paracetamol (nomograma de Rumack-Matthew após 4h), AST, ALT, TP/INR e creatinina.", cond: "Lavagem e carvão precoce. Antídoto: N-Acetilcisteína (NAC) EV: 150 mg/kg em 1h, depois 50 mg/kg em 4h e 100 mg/kg em 16h." },
            { id: "FICHA - 021", nome: "Atropina e Antimuscarínicos", sin: "Boca seca, pele vermelha e seca, midríase paralítica, taquicardia sinusal, retenção urinária, delírio e hipertermia.", ex: "Eletrólitos, ECG contínuo e monitorização térmica.", cond: "Lavagem gástrica e carvão ativado. Diazepam para sedação. Medidas físicas para controle térmico." },
            { id: "FICHA - 022", nome: "Cobra - Bothrops (Jararaca, Urutu)", sin: "Dor, edema indurado de progressão rápida, equimoses, bolhas e gengivorragia. Risco de choque e insuficiência renal aguda.", ex: "Tempo de Coagulação (TC), TAP, TPTA, hemograma e creatinina.", cond: "Soro Antibotrópico (SAB) EV puro após prometazina IM: Leve = 2-4 amp; Moderado = 5-8 amp; Grave = 12 amp." },
            { id: "FICHA - 023", nome: "Benzodiazepínicos (Diazepam, Clonazepam)", sin: "Sonolência, ataxia, disartria, hipotonia e confusão. Coma com depressão respiratória em doses maciças ou coingestão com álcool.", ex: "Glicemia capilar e oximetria de pulso.", cond: "Suporte de vias aéreas e oxigênio. Antídoto: Flumazenil 0,2 a 0,3 mg EV lento (máx 3 mg). Cuidado com histórico de convulsão." },
            { id: "FICHA - 024", nome: "Barbitúricos (Fenobarbital / Gardenal®)", sin: "Letargia, fala arrastada, ataxia, coma profundo flácido, hipotensão, choque, bradipneia e lesões bolhosas cutâneas.", ex: "Eletrólitos, glicose, gasometria e RX de tórax.", cond: "Lavagem gástrica, carvão ativado seriado (a cada 4h por 48h) e alcalinização urinária com Bicarbonato de Sódio. Hemodiálise se severo." },
            { id: "FICHA - 026", nome: "Gás Butano / Gás de Cozinha (GLP)", sin: "Asfixia por deslocamento de oxigênio. Narcose, sonolência, arritmias ventriculares por sensibilização miocárdica e parada respiratória.", ex: "Gasometria arterial e ECG.", cond: "Remoção para local arejado, oxigênio a 100% sob máscara. Evitar aminas simpaticomiméticas." },
            { id: "FICHA - 027", nome: "Cafeína", sin: "Insônia, tremores musculares finos, taquicardia, extrassístoles, arritmias ventriculares, vômitos e crises convulsivas.", ex: "ECG contínuo, eletrólitos (K) e glicemia.", cond: "Carvão ativado, Diazepam EV para tremores e convulsões. Betabloqueador cardioseletivo para controle de taquiarritmias." },
            { id: "FICHA - 030", nome: "Rodenticidas Cumarínicos (Raticidas)", sin: "Inibição de fatores da coagulação (II, VII, IX e X). Gengivorragia, epistaxe, hematúria, equimoses espontâneas e melena.", ex: "Tempo de Protrombina (TAP / INR) seriado.", cond: "Carvão ativado precoce. Antídoto: Vitamina K1 (Fitomenadiona) 10 a 25 mg IM ou EV diluída lenta de 8/8h. Plasma Fresco se sangramento ativo." },
            { id: "FICHA - 031", nome: "Acetato de Polivinila / Cola Branca", sin: "Praticamente atóxico. Ingestões volumosas podem provocar náuseas e vômitos mecânicos leves.", ex: "Avaliação clínica.", cond: "Ofertar líquidos e tranquilizar os responsáveis." },
            { id: "FICHA - 032", nome: "Etanol / Álcool Etílico (Intoxicação Aguda)", sin: "Desinibição, euforia seguida de ataxia, disartria, hipotermia, hipoglicemia severa (em crianças), estupor e coma alcoólico.", ex: "Glicemia capilar obrigatória, eletrólitos e gasometria.", cond: "Glicose a 50% EV (20 a 50 ml) precedida de Tiamina 100 mg IM/EV em adultos. Agasalhar para evitar hipotermia." },
            { id: "FICHA - 033", nome: "Plantas com Oxalato de Cálcio (Comigo-Ninguém-Pode)", sin: "Dor em queimação imediata na boca, edema volumoso de língua, lábios e glote com asfixia mecânica, sialorreia e disfagia.", ex: "Inspeção visual orofaríngea e laringoscopia.", cond: "NÃO provocar vômito nem lavagem. Gelo local, leite frio ou sais de cálcio VO. Corticoides e analgesia potente. IOT se edema de glote." },
            { id: "FICHA - 034", nome: "Cobra - Crotalus (Cascavel)", sin: "Edema local mínimo com parestesia. Fácies neurotóxica (ptose palpebral, diplopia), mialgia generalizada e urina escura cor de coca-cola.", ex: "CK total, sumário de urina, ureia, creatinina e tempo de coagulação.", cond: "Hidratação venosa vigorosa imediata (manter diurese clara >1-2 ml/kg/h). Soro Anticrotálico (SAC) EV: Moderado = 10 amp; Grave = 20 amp." },
            { id: "FICHA - 035", nome: "Cobra - Micrurus (Coral Verdadeira)", sin: "Sem lesão inflamatória local. Ptose palpebral, oftalmoplegia, salivação espessa, paralisia flácida e parada respiratória por asfixia.", ex: "Gasometria arterial, oximetria e monitorização ventilatória.", cond: "TODO CASO É GRAVE. 10 ampolas de Soro Antielapídico (SAEl) EV. Suporte de via aérea (IOT). Teste com Neostigmina + Atropina." },
            { id: "FICHA - 037", nome: "Desinfetantes Domésticos / Pinho", sin: "Lesão cáustica em mucosas, vômitos, dor retroesternal, depressão do SNC e risco de pneumonite química por aspiração.", ex: "RX de tórax se tosse/engasgo, endoscopia se dor severa.", cond: "Não provocar vômito. Pequenas doses de água. Protetor gástrico e observação clínica." },
            { id: "FICHA - 040", nome: "Cobra Não Peçonhenta (Cipó, Caninana, Jiboia)", sin: "Marcas puntiformes ou lacerações superficiais em ferradura. Sem manifestação sistêmica ou alteração de coagulação.", ex: "Tempo de coagulação em casos de dúvida.", cond: "Lavar local com água e sabão, antissepsia, vacina antitetânica e analgesia simples." },
            { id: "FICHA - 044", nome: "Fluoreto de Sódio (Flúor Odontológico)", sin: "Dor abdominal, vômitos cáusticos, tetania, hipocalcemia aguda severa, hipomagnesemia e arritmias ventriculares graves.", ex: "Cálcio iônico, magnésio, potássio e ECG.", cond: "Sais de cálcio VO (leite, carbonato). Gluconato de Cálcio 10% EV lento e Sulfato de Magnésio EV para estabilizar miocárdio." },
            { id: "FICHA - 045", nome: "Produtos de Baixa Toxicidade (Giz, Lápis, Batom)", sin: "Assintomático ou leve irritação gástrica mecânica transitória.", ex: "Desnecessários.", cond: "Ofertar líquidos e tranquilizar os responsáveis." },
            { id: "FICHA - 046", nome: "Desincrustantes / Ácido Oxálico", sin: "Queimadura química profunda na orofaringe, hematêmese, acidose metabólica grave, hipocalcemia aguda com tetania e choque.", ex: "Endoscopia precoce, gasometria e eletrólitos (cálcio).", cond: "Jejum absoluto, analgesia opioide, expansão venosa e reposição vigorosa de Gluconato de Cálcio EV." },
            { id: "FICHA - 047", nome: "Detergentes Catiônicos / Amaciantes", sin: "Queimaduras corrosivas no trato digestivo, náuseas, vômitos, sialorreia, depressão do SNC e hipotensão arterial.", ex: "Endoscopia digestiva se concentração elevada (>5%).", cond: "Demulcentes orais (hidróxido de alumínio). Suporte ventilatório e hidratação venosa." },
            { id: "FICHA - 049", nome: "Coagulantes / Ácido Épsilon-Aminocapróico (Ipsilon®)", sin: "Hipotensão severa e bradicardia se infusão rápida. Tromboses e necrose isquêmica tecidual.", ex: "ECG e coagulograma.", cond: "Suspender medicamento e suporte hemodinâmico com fluidos." },
            { id: "FICHA - 050", nome: "Piretroides (SBP, K-Othrine, Baygon)", sin: "Parestesias em face e lábios, prurido, salivação, tremores, convulsões e prolongamento de intervalo QT no ECG.", ex: "ECG para avaliação de QT e glicemia.", cond: "Lavar pele com água e sabão. Carvão ativado se ingestão. Diazepam EV para controle de convulsões." },

            { titulo: "Anemia Ferropriva e Falta de Apetite", cat: "Pediatria", txt: "Sulfato Ferroso: 3 a 5 mg/kg/dia de ferro elementar por 4 meses. Petivit BC xarope para apetite." },
            { titulo: "Dermatite Atópica, Assaduras e Impetigo", cat: "Pediatria", txt: "Assaduras: Óxido de zinco / Bepantol.\nImpetigo: Benzetacil IM DU + Mupirocina pomada 2x/dia." },
            { titulo: "Síndrome Coronariana Aguda - IAM (MONABECCH)", cat: "Cardio Urgência", txt: "Morfina 2-4mg EV SN | O2 se Sat<90% | Isordil 5mg SL | AAS 300mg mastigável | Betabloqueador | Clopidogrel 300mg VO | Estatina 40mg | Enoxaparina 1mg/kg SC 12/12h." },
            { titulo: "Edema Agudo de Pulmão (EAP)", cat: "Cardio Urgência", txt: "Cabeceira elevada, Furosemida 40-80mg EV bolus, Morfina 2-4mg EV, Nitrato SL/EV se PAS>100, VNI precoce." },
            { titulo: "Fibrilação Atrial (FA - Sem Instabilidade)", cat: "Cardio Urgência", txt: "Controle de FC: Metoprolol 50mg VO 12/12h ou Amiodarona 150mg EV em 10 min. Anticoagulação com Rivaroxabana." },
            { titulo: "AVC Isquêmico (AVCI)", cat: "Urgência / Neuro", txt: "Cabeceira 0° primeiras 6h, depois 30°. Tratar PA se > 220x120 mmHg. AAS 100mg + Clopidogrel 75mg + Sinvastatina 40mg." },
            { titulo: "Crise Convulsiva no Adulto", cat: "Urgência", txt: "Diazepam 10mg EV hemodiluído lento. Refratário: Fenitoína 4 ampolas em 80ml SF EV em 30 min." },
            { titulo: "Crise Hipertensiva", cat: "Urgência", txt: "Captopril 25mg VO (repetir em 1h SN). Resistente: Clonidina 0,1 a 0,2mg VO. Emergência: Hidralazina 1 amp EV." }
        ];

        // Renderização dos Cards
        function renderizarGuia() {
            // 1. Fichas
            document.getElementById('lista-fichas').innerHTML = fichasTox.map(f => `
                <div class="card-item bg-white p-3.5 rounded-2xl border border-gray-200 cursor-pointer hover:border-rose-300 transition-all shadow-sm" onclick="abrirModal('${f.nome}', '${f.id}', '🚨 *Sintomas:* ${f.sin}\\n\\n🔬 *Exames:* ${f.ex}\\n\\n💉 *Conduta:* ${f.cond}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black text-rose-700 bg-rose-50 px-2 py-0.5 rounded-full">${f.id}</span>
                        <span class="text-gray-400 text-[10px]">Ver ficha ➔</span>
                    </div>
                    <h4 class="text-xs font-bold text-gray-900">${f.nome}</h4>
                    <p class="text-[11px] text-gray-500 line-clamp-1 mt-0.5">${f.sin}</p>
                </div>
            `).join('');

            // 2. Antídotos
            document.getElementById('lista-antidotos').innerHTML = antidotosData.map(a => `
                <div class="card-item bg-white p-3.5 rounded-2xl border border-gray-200 cursor-pointer hover:border-emerald-300 transition-all shadow-sm" onclick="abrirModal('${a.nome}', 'ANTÍDOTO', '📦 *Apresentação:* ${a.ap}\\n\\n🎯 *Indicação:* ${a.ind}\\n\\n💊 *Posologia:* ${a.dose}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">${a.ap}</span>
                        <span class="text-gray-400 text-[10px]">Ver posologia ➔</span>
                    </div>
                    <h4 class="text-xs font-bold text-gray-900">${a.nome}</h4>
                    <p class="text-[11px] text-indigo-900 font-semibold">${a.ind}</p>
                </div>
            `).join('');

            // 3. Peçonhentos
            document.getElementById('lista-peconha').innerHTML = peconhaData.map(p => `
                <div class="card-item bg-white p-3.5 rounded-2xl border border-gray-200 cursor-pointer hover:border-amber-300 transition-all shadow-sm" onclick="abrirModal('${p.nome}', '${p.tipo}', '🔍 *Quadro Clínico:*\\n${p.quadro}\\n\\n📋 *Conduta & Soroterapia:*\\n${p.conduta}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black uppercase text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">${p.tipo}</span>
                        <span class="text-gray-400 text-[10px]">Ver conduta ➔</span>
                    </div>
                    <h4 class="text-xs font-bold text-gray-900">${p.nome}</h4>
                    <p class="text-[11px] text-gray-500 line-clamp-2 mt-1">${p.quadro}</p>
                </div>
            `).join('');

            // 4. DM & HAS
            document.getElementById('lista-dmhas').innerHTML = dmhasData.map(d => `
                <div class="card-item bg-white p-4 rounded-2xl border border-purple-100 shadow-sm cursor-pointer hover:border-purple-300 transition-all" onclick="abrirModal('${d.titulo}', '${d.cat}', '${d.txt.replace(/\n/g, '\\n')}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black uppercase text-purple-700 bg-purple-50 px-2 py-0.5 rounded-full">${d.cat}</span>
                        <span class="text-gray-400 text-[10px]">Ver diretriz ➔</span>
                    </div>
                    <h4 class="text-xs font-bold text-gray-900">${d.titulo}</h4>
                    <p class="text-[11px] text-gray-500 line-clamp-2 mt-1 whitespace-pre-line">${d.txt}</p>
                </div>
            `).join('');

            // 5. Prescrições
            document.getElementById('lista-presc').innerHTML = prescricoesData.map(p => `
                <div class="card-item bg-white p-4 rounded-2xl border border-gray-200 shadow-sm cursor-pointer hover:border-blue-300 transition-all" onclick="abrirModal('${p.titulo}', '${p.cat}', '${p.txt.replace(/\n/g, '\\n')}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black uppercase text-blue-700 bg-blue-50 px-2 py-0.5 rounded-full">${p.cat}</span>
                        <span class="text-gray-400 text-[10px]">Ver conduta ➔</span>
                    </div>
                    <h4 class="text-xs font-bold text-gray-900">${p.titulo}</h4>
                    <p class="text-[11px] text-gray-500 line-clamp-2 mt-1 whitespace-pre-line">${p.txt}</p>
                </div>
            `).join('');
        }

        // Modal
        function abrirModal(titulo, cat, corpo) {
            document.getElementById('modalCategory').innerText = cat;
            document.getElementById('modalBody').innerHTML = `<h3 class="text-sm font-black text-gray-900">${titulo}</h3><div class="text-gray-700 whitespace-pre-line mt-2">${corpo}</div>`;
            textoModalAtivo = `📋 *${titulo}* (${cat})\n\n${corpo}`;
            document.getElementById('btnEnviar').innerText = "📤 Enviar ao Telegram";
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function copiarConduta() {
            if (!textoModalAtivo) return;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(textoModalAtivo).then(() => {
                    document.getElementById('btnEnviar').innerText = "✅ Copiado!";
                });
            }
        }

        function enviarCondutaChat() {
            if (!textoModalAtivo) return;
            let enviado = false;
            if (tg && typeof tg.sendData === 'function') {
                try { tg.sendData(textoModalAtivo); enviado = true; } catch(e) {}
            }
            copiarConduta();
            if (!enviado) {
                const url = `https://t.me/share/url?url=${encodeURIComponent(textoModalAtivo)}`;
                if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
                else window.open(url, '_blank');
            }
        }

        function filtrarConteudo() {
            const q = document.getElementById('globalSearch').value.toLowerCase();
            document.querySelectorAll('.card-item').forEach(c => {
                c.style.display = c.textContent.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderizarGuia();
        });
    </script>
</body>
</html>
